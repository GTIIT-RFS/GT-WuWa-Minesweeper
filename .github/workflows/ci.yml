name: Validate game
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Temporary format inspection
        run: |
          files="supabase/functions/_shared/auth.test.ts supabase/functions/_shared/auth.ts supabase/functions/_shared/http.test.ts supabase/functions/_shared/http.ts tests/online-concurrency.spec.ts"
          npx prettier --write $files
          for file in $files; do
            printf '\\n__FORMAT_BEGIN__%s__\\n' "$file"
            cat "$file"
            printf '\\n__FORMAT_END__%s__\\n' "$file"
          done
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --no-lock --config supabase/functions/deno.json supabase/functions/competition/index.ts
      - run: deno test --no-lock --config supabase/functions/deno.json --allow-net=127.0.0.1 supabase/functions/_shared/auth.test.ts supabase/functions/_shared/http.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
