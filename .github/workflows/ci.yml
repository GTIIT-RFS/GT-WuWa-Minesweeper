name: Validate game
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Temporary formatter diff
        run: |
          npx prettier --write src/components/Board.tsx src/components/OnlineCompetition.tsx src/styles.css
          git --no-pager diff -- src/components/Board.tsx src/components/OnlineCompetition.tsx src/styles.css
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --no-lock supabase/functions/competition/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
