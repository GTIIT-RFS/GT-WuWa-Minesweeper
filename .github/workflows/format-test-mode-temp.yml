name: Temporary formatter for isolated test mode
on:
  push:
    branches:
      - feature/isolated-online-test-mode
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/isolated-online-test-mode
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/online/event-database.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/online/event-database.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format test isolation coverage"
            git push origin HEAD:feature/isolated-online-test-mode
          fi
