name: Package Windows offline game
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/windows-launcher/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-offline-game
          path: release/*.zip
